<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ПрофТест</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <nav class="p-4 bg-white shadow-sm flex justify-between">
        <span class="font-bold text-xl text-blue-600">ProTest</span>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="text-sm border rounded px-3 py-1">Личный кабинет</a>
        {% endif %}
    </nav>
    <main class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
