version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=proftest
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret_pass_123

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn --bind 0.0.0.0:8000 core.wsgi:application --workers 4"
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DB_NAME=proftest
      - DB_USER=admin
      - DB_PASSWORD=secret_pass_123
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  static_volume: